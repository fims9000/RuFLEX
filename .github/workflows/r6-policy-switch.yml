name: R6 policy-switch and hidden-shift scientific checks

on:
  push:
    paths:
      - "research/a02_reproducibility/r6/**"
      - ".github/workflows/r6-policy-switch.yml"
  pull_request:
    paths:
      - "research/a02_reproducibility/r6/**"
      - ".github/workflows/r6-policy-switch.yml"

jobs:
  r6-scientific-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/a02_reproducibility/r6/requirements-R6.txt
      - name: Install pinned environment
        run: python -m pip install -r research/a02_reproducibility/r6/requirements-R6.txt
      - name: Check predeclared local protocol SHA-256
        working-directory: research/a02_reproducibility/r6
        run: |
          python -c "import pathlib,hashlib,json; p=pathlib.Path('PROTOCOL_R6.json'); r=json.loads(pathlib.Path('PROTOCOL_R6_FREEZE.json').read_text()); assert hashlib.sha256(p.read_bytes()).hexdigest()==r['protocol_sha256']"
      - name: Run switch theory and chronological pipeline tests
        working-directory: research/a02_reproducibility/r6/code
        run: python -m pytest -q test_switch_theory.py test_temporal.py
      - name: Independently recompute checked-in case-level decisions
        working-directory: research/a02_reproducibility/r6/code
        run: python verify_r6.py --protocol ../PROTOCOL_R6.json --results ../results/new_temporal
      - name: Execute new 136-fit temporal challenge without downloading data
        working-directory: research/a02_reproducibility/r6/code
        run: python run_new_temporal.py --protocol ../PROTOCOL_R6.json --out ../results_ci
      - name: Verify independent new fit and predictions
        working-directory: research/a02_reproducibility/r6/code
        run: |
          python verify_r6.py --protocol ../PROTOCOL_R6.json --results ../results_ci
          python -c "import json; m=json.load(open('../results_ci/R6_TEMPORAL_MANIFEST.json')); assert m['fit_count']==136 and m['model_cells']==8"
