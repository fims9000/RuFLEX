name: R5 Conditional Decision Value — reproducibility

on:
  push:
    paths:
      - "research/a02_reproducibility/r5/**"
      - ".github/workflows/r5-conditional-value.yml"
  pull_request:
    paths:
      - "research/a02_reproducibility/r5/**"
      - ".github/workflows/r5-conditional-value.yml"

jobs:
  new-temporal-challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned research dependencies
        run: python -m pip install -r research/a02_reproducibility/r5/requirements-R5.txt
      - name: Verify frozen research protocol hash and run unit tests
        working-directory: research/a02_reproducibility/r5
        run: |
          python -c "import hashlib,pathlib; p=pathlib.Path('PROTOCOL_R5.json'); assert hashlib.sha256(p.read_bytes()).hexdigest()=='791ee6dd60c84cf09e02cd01571d14c9f646ae46c45f638bd92565aa98804291'"
          python -m pytest -q code/test_core.py
      - name: Rerun full 248-fit chronological experiment with new output directory
        working-directory: research/a02_reproducibility/r5/code
        run: python run_temporal_co2.py --protocol ../PROTOCOL_R5.json --out ../results_ci
      - name: Independently recompute decisions from heldout case-level scores
        working-directory: research/a02_reproducibility/r5/code
        run: python verify_r5.py --protocol ../PROTOCOL_R5.json --results ../results_ci
      - name: Assert declared fit count and primary fold, without pooling dependent folds
        working-directory: research/a02_reproducibility/r5
        run: |
          python -c "import json; r=json.load(open('results_ci/R5_TEMPORAL_RECEIPT.json')); assert r['reference_and_audit_fit_count']==248 and r['cells']==8 and r['primary_fold']=='late_primary'"
