[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruflex"
version = "0.1.0"
description = "RuFLEX platform for hybrid deep fuzzy learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "python-docx>=1.2"]
external-backend = ["ruanfis @ git+https://github.com/lebedeffson/deep-neuro-fuzzy.git"]
ui = ["streamlit>=1.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --ignore=tests/upstream"
